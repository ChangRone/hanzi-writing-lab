<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hanzi Writing Lab</title>
  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
      margin:0;
      background:#f6f7fb;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }
    .card{
      background:#fff;
      padding:32px;
      border-radius:20px;
      box-shadow:0 20px 50px rgba(0,0,0,0.08);
      text-align:center;
      width:min(380px,calc(100vw - 32px));
    }
    h1{margin:0 0 8px;font-size:22px}.note{margin:0 0 20px;color:#667085;font-size:13px;line-height:1.5}
    a{
      display:block;
      margin:10px 0;
      padding:12px;
      border-radius:12px;
      text-decoration:none;
      background:#315cf6;
      color:#fff;
      font-weight:bold;
    }
    a.secondary{background:#eef3ff;color:#315cf6}
    a.speech{background:#edf8ef;color:#2c6a39}
  </style>
</head>
<body>
<div class="card">
  <h1>Hanzi Writing Lab</h1>
  <p class="note">字形資料轉換、QA，以及正式 Quiz 上線前的實驗工具。</p>

</div>
</body>
</html>
