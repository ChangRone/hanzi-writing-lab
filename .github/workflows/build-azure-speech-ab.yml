name: Build Azure Speech A/B assets

# This workflow is the repeatable Lab entry point after Azure Speech repository secrets are configured.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/speech-lab/cases.json'
      - 'tools/speech-lab/build_azure_speech.py'
      - '.github/workflows/build-azure-speech-ab.yml'

permissions:
  contents: write

concurrency:
  group: azure-speech-ab
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      AZURE_TTS_MIN_INTERVAL: '3.2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh queued run to latest main
        run: git pull --ff-only origin main

      - name: Validate test cases and prepare manifest
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AZURE_SPEECH_KEY}" || -z "${AZURE_SPEECH_REGION}" ]]; then
            echo "::warning::Azure Speech secrets are not configured; generating a dry-run manifest only."
            python3 tools/speech-lab/build_azure_speech.py --dry-run
          else
            python3 tools/speech-lab/build_azure_speech.py
          fi

      - name: Validate generated assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('tools/speech-lab/generated/manifest.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          assert m['caseCount'] > 0
          assert m['modes'] == ['partial', 'full']
          assert len(m['voices']) == 3
          expected = m['caseCount'] * len(m['voices']) * len(m['modes'])
          assert m['variantCountExpected'] == expected
          if m['status'] == 'generated':
              ready = 0
              for case in m['variants'].values():
                  for voice in case['variants'].values():
                      for variant in voice.values():
                          assert variant['ready'] is True
                          f = Path(variant['audio'])
                          assert f.exists() and f.stat().st_size > 500
                          ready += 1
              assert ready == expected, (ready, expected)
          print('manifest validation OK:', m['status'])
          PY
          git diff --check

      - name: Commit generated MP3 and manifest
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/speech-lab/generated; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/speech-lab/generated
          git commit -m 'build Azure Speech A/B audio assets'
          git pull --rebase origin main
          git push origin HEAD:main
